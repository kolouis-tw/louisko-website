<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>八字檔案下載</title>
  <link rel="stylesheet" href="../../assets/louisko-theme.css">
  <link rel="stylesheet" href="./file-delivery.css?v=20261020-2">
  <style>
    main { max-width: 960px; margin: 32px auto; padding: 20px; }
    .download-card { background: #fff; border-radius: 20px; padding: clamp(22px,5vw,44px); }
    h1 { font-size: clamp(30px,5vw,46px); margin-top: 0; }
    p { line-height: 1.8; }
    #download-status { overflow-wrap: anywhere; min-height: 2em; }
    progress { width: 100%; height: 16px; accent-color: #a66f63; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { .file-actions > * { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <section class="download-card" aria-labelledby="download-title">
      <h1 id="download-title">八字檔案下載</h1>
      <p>先載入檔案，確認內容後再選擇儲存方式。</p>
      <div class="file-actions">
        <button id="download-file" type="button" disabled>載入檔案</button>
        <a id="external-browser" class="file-action" rel="noopener noreferrer" hidden>使用 Safari／Chrome 開啟</a>
        <button id="reload-page" type="button" onclick="location.reload()">重新載入頁面</button>
      </div>
      <div id="download-progress" hidden>
        <progress id="transfer-progress" aria-label="檔案載入進度"></progress>
        <p id="transfer-detail" aria-live="polite"></p>
      </div>
      <p id="download-status" role="status" aria-live="polite">正在初始化下載功能…</p>
      <noscript><p>請啟用 JavaScript，或使用 Safari／Chrome 開啟此連結後載入檔案。</p></noscript>
      <section id="file-result" class="file-result" aria-label="已準備的檔案" hidden></section>
      <a href="./">返回八字網站</a>
    </section>
  </main>
  <script>
    function downloadStartupFailed() {
      document.getElementById("download-file").disabled = true;
      document.getElementById("download-status").textContent = "下載功能未能載入，請重新載入頁面；若仍無法使用，請以 Safari／Chrome 開啟新連結。";
      document.getElementById("reload-page").hidden = false;
    }
  </script>
  <script src="./file-delivery.js?v=20261020-2" onerror="downloadStartupFailed()"></script>
  <script src="./line-download.js?v=20261020-2" onerror="downloadStartupFailed()"></script>
</body>
</html>
