<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>八字檔案下載</title>
  <link rel="stylesheet" href="../../assets/louisko-theme.css">
  <style>
    main { max-width: 960px; margin: 32px auto; padding: 20px; }
    .download-card { background: #fff; border-radius: 20px; padding: clamp(22px,5vw,44px); }
    h1 { font-size: clamp(30px,5vw,46px); margin-top: 0; }
    p { line-height: 1.8; }
    button, .file-action { max-width: 100%; min-height: 48px; }
    .file-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; }
    .file-action { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border: 1px solid #a66f63; border-radius: 12px; text-decoration: none; background: #fff; color: #26302f; box-sizing: border-box; }
    #download-status, #file-name { overflow-wrap: anywhere; }
    #download-status { min-height: 2em; }
    #file-result { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 20px; }
    #file-name { margin: 0 0 8px; font-size: 20px; }
    progress { width: 100%; height: 16px; accent-color: #a66f63; }
    #chart-preview { display: block; width: 100%; height: auto; margin-top: 20px; border: 1px solid #ddd; }
    #text-preview { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 520px; overflow: auto; padding: 18px; background: #f4f4f0; font: 16px/1.8 sans-serif; }
    #save-help { font-size: 15px; color: #4e5b5a; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { .file-actions > * { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <section class="download-card" aria-labelledby="download-title">
      <h1 id="download-title">八字檔案下載</h1>
      <p>先載入檔案，確認內容後再選擇儲存方式。</p>
      <div class="file-actions">
        <button id="download-file" type="button">載入檔案</button>
        <a id="external-browser" class="file-action" rel="noopener noreferrer" hidden>使用 Safari／Chrome 開啟</a>
      </div>
      <div id="download-progress" hidden>
        <progress id="transfer-progress" aria-label="檔案載入進度"></progress>
        <p id="transfer-detail" aria-live="polite"></p>
      </div>
      <p id="download-status" role="status" aria-live="polite"></p>
      <section id="file-result" aria-labelledby="file-name" hidden>
        <h2 id="file-name"></h2>
        <p id="file-size"></p>
        <div class="file-actions">
          <button id="share-file" type="button" hidden>分享／儲存到檔案</button>
          <a id="save-file" class="file-action">儲存檔案</a>
          <a id="open-file" class="file-action" target="_blank" rel="noopener noreferrer">開啟檔案</a>
          <button id="copy-text" type="button" hidden>複製全文</button>
        </div>
        <p id="save-help"></p>
        <img id="chart-preview" alt="八字命盤細盤預覽" hidden>
        <pre id="text-preview" tabindex="0" aria-label="顧問檔案全文" hidden></pre>
      </section>
      <a href="./">返回八字網站</a>
    </section>
  </main>
  <script src="./line-download.js"></script>
</body>
</html>
